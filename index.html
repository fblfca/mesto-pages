<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesto</title>
    <script type="module" crossorigin src="./assets/index-DHUkN_VI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-1rSy84RF.css">
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          class="header__logo"
          src="./assets/logo-C_QQpFK1.svg"
          alt="Логотип Mesto"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__image" aria-label="Редактировать аватар"></div>

          <div class="profile__info">
            <div class="profile__title-wrap">
              <h1 class="profile__title"></h1>
              <button
                class="profile__edit-button"
                type="button"
                aria-label="Редактировать профиль"
              ></button>
            </div>
            <p class="profile__description"></p>
          </div>

          <button
            class="profile__add-button"
            type="button"
            aria-label="Добавить карточку"
          ></button>
        </section>

        <section class="places page__section">
          <ul class="places__list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Mesto Russia</p>
      </footer>
    </div>

    <div class="popup popup_type_edit">
      <div class="popup__content">
        <button
          type="button"
          class="popup__close"
          aria-label="Закрыть"
        ></button>
        <h2 class="popup__title">Редактировать профиль</h2>
        <form class="popup__form" name="edit-profile" novalidate>
          <input
            id="profile-name-input"
            class="popup__input popup__input_type_name"
            type="text"
            name="name"
            placeholder="Имя"
            minlength="2"
            maxlength="40"
            required
          />
          <span class="profile-name-input-error popup__error"></span>

          <input
            id="profile-description-input"
            class="popup__input popup__input_type_description"
            type="text"
            name="description"
            placeholder="Занятие"
            minlength="2"
            maxlength="200"
            required
          />
          <span class="profile-description-input-error popup__error"></span>

          <button type="submit" class="popup__button">Сохранить</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_new-card">
      <div class="popup__content">
        <button
          type="button"
          class="popup__close"
          aria-label="Закрыть"
        ></button>
        <h2 class="popup__title">Новое место</h2>
        <form class="popup__form" name="new-place" novalidate>
          <input
            id="card-name-input"
            class="popup__input popup__input_type_card-name"
            type="text"
            name="place-name"
            placeholder="Название"
            minlength="2"
            maxlength="30"
            required
          />
          <span class="card-name-input-error popup__error"></span>

          <input
            id="card-url-input"
            class="popup__input popup__input_type_url"
            type="url"
            name="link"
            placeholder="Ссылка на картинку"
            required
          />
          <span class="card-url-input-error popup__error"></span>

          <button type="submit" class="popup__button">Создать</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_edit-avatar">
      <div class="popup__content">
        <button
          type="button"
          class="popup__close"
          aria-label="Закрыть"
        ></button>
        <h2 class="popup__title">Обновить аватар</h2>
        <form class="popup__form" name="edit-avatar" novalidate>
          <input
            id="avatar-url-input"
            class="popup__input popup__input_type_avatar-url"
            type="url"
            name="avatar"
            placeholder="Ссылка на аватар"
            required
          />
          <span class="avatar-url-input-error popup__error"></span>

          <button type="submit" class="popup__button">Сохранить</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_image">
      <div class="popup__content popup__content_content_image">
        <button
          type="button"
          class="popup__close popup__close_type_image"
          aria-label="Закрыть"
        ></button>
        <img class="popup__image" src="" alt="" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <div class="popup popup_type_remove-card">
      <div class="popup__content">
        <button
          type="button"
          class="popup__close"
          aria-label="Закрыть"
        ></button>
        <h2 class="popup__title">Вы уверены?</h2>
        <form class="popup__form" name="remove-card" novalidate>
          <button type="submit" class="popup__button">Да</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_card-info">
      <div class="popup__content popup__content_content_info">
        <button
          type="button"
          class="popup__close"
          aria-label="Закрыть"
        ></button>
        <h2 class="popup__title popup__card-title"></h2>
        <dl class="popup__info">
          <div class="popup__info-item">
            <dt class="popup__info-term">Автор</dt>
            <dd class="popup__info-description popup__card-owner"></dd>
          </div>
          <div class="popup__info-item">
            <dt class="popup__info-term">Дата</dt>
            <dd class="popup__info-description popup__card-date"></dd>
          </div>
        </dl>
        <h3 class="popup__text">Лайки</h3>
        <ul class="popup__list popup__card-likes"></ul>
      </div>
    </div>

    <template id="card-template">
      <li class="places__item">
        <article class="card">
          <div class="card__control">
            <button
              type="button"
              class="card__control-button card__control-button_type_info"
              aria-label="Подробнее о карточке"
            ></button>
            <button
              type="button"
              class="card__control-button card__control-button_type_delete"
              aria-label="Удалить карточку"
            ></button>
          </div>
          <img class="card__image" src="" alt="" />
          <div class="card__description">
            <h2 class="card__title"></h2>
            <div class="card__like-container">
              <button
                type="button"
                class="card__like-button"
                aria-label="Поставить лайк"
              ></button>
              <span class="card__like-count">0</span>
            </div>
          </div>
        </article>
      </li>
    </template>

  </body>
</html>
